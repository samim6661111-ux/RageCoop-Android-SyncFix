name: Build RageCoop Android Sync Fix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-client:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # The project was uploaded as loose files in the repository root.
      # Recreate the original folder layout before running tests/build.
      - name: Restore original project folders from flat upload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mapPath = Join-Path $PWD 'FLAT_FILE_MAP.json'
          if (-not (Test-Path -LiteralPath $mapPath)) {
            throw 'FLAT_FILE_MAP.json is missing. Upload every extracted file from the flat package, including FLAT_FILE_MAP.json.'
          }
          $map = Get-Content -LiteralPath $mapPath -Raw | ConvertFrom-Json
          foreach ($item in $map) {
            # The active workflow already lives at .github/workflows/build.yml.
            if ($item.restore_path -eq '.github/workflows/build.yml') { continue }
            $src = Join-Path $PWD $item.archive_file
            if (-not (Test-Path -LiteralPath $src)) {
              throw "Missing flat upload file: $($item.archive_file)"
            }
            $dest = Join-Path $PWD $item.restore_path
            $parent = Split-Path -Parent $dest
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $src -Destination $dest -Force
          }
          if (-not (Test-Path -LiteralPath (Join-Path $PWD 'tests/test_sync_fix_sources.py'))) {
            throw 'Restore failed: tests/test_sync_fix_sources.py was not created.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $PWD 'build_windows.ps1'))) {
            throw 'Restore failed: build_windows.ps1 was not created.'
          }

      - name: Validate Android source patches
        run: python tests/test_sync_fix_sources.py

      - name: Compile RageCoop.Client.dll
        shell: pwsh
        run: ./build_windows.ps1

      - name: Create flat install ZIP and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $PWD 'install/games/gtav/scripts/RageCoop/RageCoop.Client.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw "Build output not found: $dll" }
          $stage = Join-Path $env:RUNNER_TEMP 'ragecoop-flat-package'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $dll -Destination (Join-Path $stage 'RageCoop.Client.dll')
          $hash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $stage 'SHA256SUMS.txt') -Value "$hash  RageCoop.Client.dll" -Encoding utf8
          @'
          INSTALL:
          Back up the old DLL, then copy ONLY RageCoop.Client.dll to:
          /storage/emulated/0/games/gtav/scripts/RageCoop/RageCoop.Client.dll
          Do not replace RageCoop.Core.dll, APK, native bridge, GtavHost.dll or Mono runtime.
          Successful compilation does not prove multiplayer sync; test with two clients.
          '@ | Set-Content -Path (Join-Path $stage 'INSTALL.txt') -Encoding utf8
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $PWD 'RageCoop-Android-SyncFix-ClientDLL.zip') -Force

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: RageCoop-Android-SyncFix
          if-no-files-found: error
          path: |
            install/games/gtav/scripts/RageCoop/RageCoop.Client.dll
            RageCoop-Android-SyncFix-ClientDLL.zip
            build_logs/RageCoop.Client.log


name: Build RageCoop Android Sync + Menu Navigation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-client:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Restore original project folders from flat upload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $map = Get-Content FLAT_FILE_MAP.json -Raw | ConvertFrom-Json
          foreach ($item in $map) {
            if ($item.restore_path -eq '.github/workflows/build.yml') { continue }
            $src = Join-Path $PWD $item.archive_file
            $dest = Join-Path $PWD $item.restore_path
            if (-not (Test-Path -LiteralPath $src)) { throw "Missing flat file: $src" }
            if ([IO.Path]::GetFullPath($src) -eq [IO.Path]::GetFullPath($dest)) { continue }
            $parent = Split-Path -Parent $dest
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $src -Destination $dest -Force
          }
          if (-not (Test-Path 'tests/test_sync_fix_sources.py')) { throw 'Source test missing.' }
          if (-not (Test-Path 'build_windows.ps1')) { throw 'Build script missing.' }

      - name: Verify original Lidgren reference
        shell: pwsh
        run: |
          $actual = (Get-FileHash build_refs/Lidgren.Network.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '0cf348189180207818848fe669b60b03d9176596fa5b4bb02533ffcb04e599c3'
          if ($actual -ne $expected) { throw 'Wrong Lidgren reference DLL.' }

      - name: Locate old Android menu DLL
        shell: pwsh
        run: |
          $expected = '3d519502c4a15f22e4d465b2a054dd545b2dcee2c96ca4437d627bca5533caeb'
          $found = Get-ChildItem -Path $PWD -Filter '*.dll' -File -Recurse |
            Where-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -eq $expected } |
            Select-Object -First 1
          if (-not $found) { throw 'Old Android menu DLL not found.' }
          $dest = Join-Path $env:RUNNER_TEMP 'RageCoop.Client.AndroidMenuSource.dll'
          Copy-Item $found.FullName $dest -Force
          "RAGECOOP_MENU_SOURCE=$dest" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Recover Android menu navigation source
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'nav-decompiler'
          $inputDir = Join-Path $env:RUNNER_TEMP 'nav-input'
          New-Item -ItemType Directory -Force $inputDir | Out-Null
          Copy-Item $env:RAGECOOP_MENU_SOURCE $inputDir
          dotnet new console --framework net8.0 --output $tool --force
          dotnet add "$tool/nav-decompiler.csproj" package ICSharpCode.Decompiler --version 11.2.0.10050
          $program = @'
          using System;
          using System.IO;
          using System.Text;
          using ICSharpCode.Decompiler;
          using ICSharpCode.Decompiler.CSharp;
          using ICSharpCode.Decompiler.TypeSystem;
          if (args.Length != 2) return 2;
          var d = new CSharpDecompiler(args[0], new DecompilerSettings { ThrowOnAssemblyResolveErrors = false });
          Directory.CreateDirectory(args[1]);
          foreach (var t in new[] { "RageCoop.Client.Menus.AndroidMenuNav", "RageCoop.Client.Menus.AndroidLog" }) {
            var s = d.DecompileTypeAsString(new FullTypeName(t));
            File.WriteAllText(Path.Combine(args[1], t.Substring(t.LastIndexOf('.') + 1) + ".Imported.cs"), s, new UTF8Encoding(false));
          }
          return 0;
          '@
          Set-Content "$tool/Program.cs" $program -Encoding utf8
          $menuDir = Join-Path $PWD 'source/RageCoop.Client/Menus'
          dotnet run --project "$tool/nav-decompiler.csproj" --configuration Release -- "$env:RAGECOOP_MENU_SOURCE" "$menuDir"
          if (-not (Test-Path "$menuDir/AndroidMenuNav.Imported.cs")) { throw 'AndroidMenuNav source missing.' }
          if (-not (Test-Path "$menuDir/AndroidLog.Imported.cs")) { throw 'AndroidLog source missing.' }

      - name: Restore menu tick hook
        shell: pwsh
        run: |
          $p = 'source/RageCoop.Client/Main.cs'
          $s = Get-Content $p -Raw
          if ($s -notmatch 'AndroidMenuNav\.Tick\(\)') {
            $needle = '            CoopMenu.MenuPool.Process();'
            if (-not $s.Contains($needle)) { throw 'Menu pool hook not found.' }
            $s = $s.Replace($needle, $needle + [Environment]::NewLine + '            AndroidMenuNav.Tick();')
            Set-Content $p $s -Encoding utf8
          }

      - name: Validate source patches
        run: python tests/test_sync_fix_sources.py

      - name: Fix Roslyn output argument
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'build_windows.ps1'
          $s = Get-Content $p -Raw
          $pattern = '(?s)foreach \(\$arg in @\(''/nologo''.*?\)\) \{\s*\$compilerArgs\.Add\(\$arg\)\s*\}'
          $replacement = @'
          $compilerArgs.Add('/nologo')
          $compilerArgs.Add('/noconfig')
          $compilerArgs.Add('/target:library')
          $compilerArgs.Add('/unsafe+')
          $compilerArgs.Add('/optimize+')
          $compilerArgs.Add('/langversion:latest')
          $compilerArgs.Add('/nostdlib+')
          $compilerArgs.Add('/platform:anycpu')
          if ([string]::IsNullOrWhiteSpace($clientOut)) { throw 'clientOut is empty.' }
          $compilerArgs.Add(('/out:{0}' -f $clientOut))
          '@
          $s2 = [regex]::Replace($s, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement }, 1)
          if ($s2 -ceq $s) { throw 'Could not patch compiler argument block.' }
          Set-Content $p $s2 -Encoding utf8
          if ((Get-Content $p -Raw) -notmatch "compilerArgs\.Add\(\('/out:\{0\}' -f \$clientOut\)\)") { throw 'Output argument patch verification failed.' }

      - name: Compile Client DLL
        shell: pwsh
        run: ./build_windows.ps1

      - name: Upload compiled Client DLL
        uses: actions/upload-artifact@v7
        with:
          name: RageCoop-Android-SyncFix
          if-no-files-found: error
          path: |
            install/games/gtav/scripts/RageCoop/RageCoop.Client.dll
            build_logs/RageCoop.Client.log

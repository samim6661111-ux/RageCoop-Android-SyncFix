name: Build RageCoop Android Sync + Menu Navigation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-client:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Restore original project folders from flat upload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mapPath = Join-Path $PWD 'FLAT_FILE_MAP.json'
          if (-not (Test-Path -LiteralPath $mapPath)) {
            throw 'FLAT_FILE_MAP.json is missing. Upload every extracted file from the flat package.'
          }
          $map = Get-Content -LiteralPath $mapPath -Raw | ConvertFrom-Json
          foreach ($item in $map) {
            if ($item.restore_path -eq '.github/workflows/build.yml') { continue }
            $src = Join-Path $PWD $item.archive_file
            if (-not (Test-Path -LiteralPath $src)) { throw "Missing flat upload file: $($item.archive_file)" }
            $dest = Join-Path $PWD $item.restore_path
            $srcFull = [System.IO.Path]::GetFullPath($src)
            $destFull = [System.IO.Path]::GetFullPath($dest)
            if ([string]::Equals($srcFull, $destFull, [System.StringComparison]::OrdinalIgnoreCase)) { continue }
            $parent = Split-Path -Parent $dest
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $srcFull -Destination $destFull -Force
          }
          if (-not (Test-Path 'tests/test_sync_fix_sources.py')) { throw 'Source test file missing after restore.' }
          if (-not (Test-Path 'build_windows.ps1')) { throw 'Build script missing after restore.' }
          if (-not (Test-Path 'source/RageCoop.Client/Main.cs')) { throw 'Client Main.cs missing after restore.' }

      - name: Verify original Lidgren reference assembly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lidgren = Join-Path $PWD 'build_refs/Lidgren.Network.dll'
          if (-not (Test-Path -LiteralPath $lidgren)) { throw 'build_refs/Lidgren.Network.dll is missing.' }
          $actual = (Get-FileHash -LiteralPath $lidgren -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '0cf348189180207818848fe669b60b03d9176596fa5b4bb02533ffcb04e599c3'
          if ($actual -ne $expected) { throw 'Wrong Lidgren.Network.dll reference. Upload the supplied original reference DLL.' }
          Write-Host "Verified Lidgren.Network.dll: $actual"

      - name: Locate and verify old Android menu source DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '3d519502c4a15f22e4d465b2a054dd545b2dcee2c96ca4437d627bca5533caeb'
          $candidateNames = @('RageCoop.Client.AndroidMenuSource.dll','RageCoop.Client.dll5','RageCoop.Client (1).dll')
          $matches = @()
          foreach ($name in $candidateNames) {
            $matches += Get-ChildItem -LiteralPath $PWD -Filter $name -File -Recurse -ErrorAction SilentlyContinue
          }
          $oldDll = $null
          foreach ($candidate in $matches) {
            $actual = (Get-FileHash -LiteralPath $candidate.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -eq $expected) { $oldDll = $candidate.FullName; break }
          }
          if (-not $oldDll) {
            Write-Host 'Repository DLL files found:'
            Get-ChildItem -LiteralPath $PWD -Filter '*.dll' -File -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw 'Old Android menu DLL is missing. Upload RageCoop.Client.AndroidMenuSource.dll (or the original RageCoop.Client.dll5) to the repository root. Its SHA-256 must be 3d519502c4a15f22e4d465b2a054dd545b2dcee2c96ca4437d627bca5533caeb.'
          }
          Copy-Item -LiteralPath $oldDll -Destination (Join-Path $env:RUNNER_TEMP 'RageCoop.Client.AndroidMenuSource.dll') -Force
          'RAGECOOP_MENU_SOURCE=' + (Join-Path $env:RUNNER_TEMP 'RageCoop.Client.AndroidMenuSource.dll') | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verified old Android menu DLL: $oldDll"

      - name: Recover Android menu navigation source from old DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolDir = Join-Path $env:RUNNER_TEMP 'ragecoop-nav-decompiler'
          $inputDir = Join-Path $env:RUNNER_TEMP 'ragecoop-nav-input'
          New-Item -ItemType Directory -Force -Path $inputDir | Out-Null
          Copy-Item -LiteralPath $env:RAGECOOP_MENU_SOURCE -Destination (Join-Path $inputDir 'RageCoop.Client.AndroidMenuSource.dll') -Force
          Copy-Item -Path (Join-Path $PWD 'build_refs/*.dll') -Destination $inputDir -Force
          dotnet new console --framework net8.0 --output $toolDir --force
          dotnet add (Join-Path $toolDir 'ragecoop-nav-decompiler.csproj') package ICSharpCode.Decompiler --version 11.2.0.10050
          $program = @'
          using System;
          using System.IO;
          using System.Text;
          using ICSharpCode.Decompiler;
          using ICSharpCode.Decompiler.CSharp;
          using ICSharpCode.Decompiler.TypeSystem;

          if (args.Length != 2)
          {
              Console.Error.WriteLine("Usage: decompiler <assembly> <output-directory>");
              return 2;
          }

          string assemblyPath = args[0];
          string outputDirectory = args[1];
          Directory.CreateDirectory(outputDirectory);
          var settings = new DecompilerSettings { ThrowOnAssemblyResolveErrors = false };
          var decompiler = new CSharpDecompiler(assemblyPath, settings);
          string[] types =
          {
              "RageCoop.Client.Menus.AndroidMenuNav",
              "RageCoop.Client.Menus.AndroidLog"
          };
          foreach (string typeName in types)
          {
              string source = decompiler.DecompileTypeAsString(new FullTypeName(typeName));
              if (string.IsNullOrWhiteSpace(source) || !source.Contains(typeName.Substring(typeName.LastIndexOf('.') + 1), StringComparison.Ordinal))
                  throw new InvalidOperationException("Decompilation produced no source for " + typeName);
              string fileName = typeName.Substring(typeName.LastIndexOf('.') + 1) + ".Imported.cs";
              File.WriteAllText(Path.Combine(outputDirectory, fileName), source, new UTF8Encoding(false));
              Console.WriteLine("Recovered " + typeName);
          }
          return 0;
          '@
          Set-Content -LiteralPath (Join-Path $toolDir 'Program.cs') -Value $program -Encoding utf8
          $decompiledDir = Join-Path $PWD 'source/RageCoop.Client/Menus'
          dotnet run --project (Join-Path $toolDir 'ragecoop-nav-decompiler.csproj') --configuration Release -- (Join-Path $inputDir 'RageCoop.Client.AndroidMenuSource.dll') $decompiledDir
          foreach ($file in @('AndroidMenuNav.Imported.cs','AndroidLog.Imported.cs')) {
            if (-not (Test-Path (Join-Path $decompiledDir $file))) { throw "Navigation source was not generated: $file" }
          }

      - name: Restore Android menu tick hook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mainPath = Join-Path $PWD 'source/RageCoop.Client/Main.cs'
          $mainText = Get-Content -LiteralPath $mainPath -Raw
          if ($mainText -notmatch 'AndroidMenuNav\.Tick\(\)') {
            $needle = '            CoopMenu.MenuPool.Process();'
            if (-not $mainText.Contains($needle)) { throw 'Could not find the menu pool processing line in Main.cs.' }
            $replacement = $needle + [Environment]::NewLine + '            AndroidMenuNav.Tick();'
            $mainText = $mainText.Replace($needle, $replacement)
            Set-Content -LiteralPath $mainPath -Value $mainText -Encoding utf8
          }
          if ($mainText -notmatch 'AndroidMenuNav\.Tick\(\)') { throw 'AndroidMenuNav.Tick() hook was not inserted.' }
          Write-Host 'Restored Android menu navigation tick hook.'

      - name: Validate Android source patches
        run: python tests/test_sync_fix_sources.py

      - name: Fix and verify Roslyn output argument in build script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $PWD 'build_windows.ps1'
          $scriptText = Get-Content -LiteralPath $scriptPath -Raw
          $old = "foreach (`$arg in @('/nologo','/noconfig','/target:library','/unsafe+','/optimize+','/langversion:latest','/nostdlib+','/platform:anycpu','/out:' + `$clientOut)) {`r`n    `$compilerArgs.Add(`$arg)`r`n}"
          if (-not $scriptText.Contains($old)) {
            $pattern = '(?s)foreach \(\$arg in @\('/nologo'.*?\)\) \{\s*\$compilerArgs\.Add\(\$arg\)\s*\}'
            if ($scriptText -notmatch $pattern) { throw 'Could not find original compiler argument block.' }
            $replacement = @'
          $compilerArgs.Add('/nologo')
          $compilerArgs.Add('/noconfig')
          $compilerArgs.Add('/target:library')
          $compilerArgs.Add('/unsafe+')
          $compilerArgs.Add('/optimize+')
          $compilerArgs.Add('/langversion:latest')
          $compilerArgs.Add('/nostdlib+')
          $compilerArgs.Add('/platform:anycpu')
          if ([string]::IsNullOrWhiteSpace($clientOut)) { throw 'clientOut is empty before compiler argument creation.' }
          $compilerArgs.Add(('/out:{0}' -f $clientOut))
          '@
            $scriptText = [regex]::Replace($scriptText, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement }, 1)
          } else {
            $scriptText = $scriptText.Replace("'/out:' + `$clientOut", "('/out:{0}' -f `$clientOut)")
          }
          Set-Content -LiteralPath $scriptPath -Value $scriptText -Encoding utf8
          $check = Get-Content -LiteralPath $scriptPath -Raw
          if (-not $check.Contains('$compilerArgs.Add((''/out:{0}'' -f $clientOut))')) { throw 'Output argument patch did not apply.' }
          Write-Host 'Verified build script now constructs /out:<full DLL path>.'

      - name: Compile RageCoop.Client.dll
        shell: pwsh
        run: ./build_windows.ps1

      - name: Verify merged menu navigation type source was compiled
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $PWD 'install/games/gtav/scripts/RageCoop/RageCoop.Client.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw 'Compiled Client DLL is missing.' }
          if ((Get-Item -LiteralPath $dll).Length -lt 4096) { throw 'Compiled Client DLL is unexpectedly small.' }
          Write-Host "Compiled DLL size: $((Get-Item -LiteralPath $dll).Length) bytes"
          Write-Host 'Navigation source and Tick hook were included in the compiler input.'

      - name: Create flat install ZIP and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $PWD 'install/games/gtav/scripts/RageCoop/RageCoop.Client.dll'
          $stage = Join-Path $env:RUNNER_TEMP 'ragecoop-flat-package'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $dll -Destination (Join-Path $stage 'RageCoop.Client.dll')
          $hash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $stage 'SHA256SUMS.txt') -Value "$hash  RageCoop.Client.dll" -Encoding utf8
          @'
          INSTALL:
          Back up the old DLL, then copy ONLY RageCoop.Client.dll to:
          /storage/emulated/0/games/gtav/scripts/RageCoop/RageCoop.Client.dll
          Do not replace RageCoop.Core.dll, APK, native bridge, GtavHost.dll or Mono runtime.
          Android menu navigation source was recovered from the supplied old DLL and its Tick hook was restored.
          Build success does not prove runtime behaviour; test menu navigation and multiplayer sync on-device.
          '@ | Set-Content -Path (Join-Path $stage 'INSTALL.txt') -Encoding utf8
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $PWD 'RageCoop-Android-SyncFix-ClientDLL.zip') -Force

      - name: Upload compiler log for debugging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: RageCoop-Android-SyncFix-Build-Logs
          if-no-files-found: ignore
          path: build_logs/RageCoop.Client.log

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: RageCoop-Android-SyncFix
          if-no-files-found: error
          path: |
            install/games/gtav/scripts/RageCoop/RageCoop.Client.dll
            RageCoop-Android-SyncFix-ClientDLL.zip
            build_logs/RageCoop.Client.log
